<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stationery Inventory · NSDC</title>
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-dashboard="stationery">
  <div class="app">
    <header class="topbar" id="topbar"></header>

    <nav class="nav" role="tablist" aria-label="Dashboard sections">
      <button class="tab" role="tab" type="button" data-tab="overview" data-icon="grid">Overview</button>
      <button class="tab" role="tab" type="button" data-tab="inventory" data-icon="package">Inventory</button>
      <button class="tab" role="tab" type="button" data-tab="requests" data-icon="clipboard">Requests</button>
      <button class="tab" role="tab" type="button" data-tab="stationery" data-icon="pen">Stationery management</button>
    </nav>

    <main>
      <!-- 1. Dashboard overview + 2. Quick actions -->
      <section data-section="overview" role="tabpanel" aria-label="Overview"></section>
      <!-- 3. Inventory management -->
      <section data-section="inventory" role="tabpanel" aria-label="Inventory management" hidden></section>
      <!-- 4. Request management -->
      <section data-section="requests" role="tabpanel" aria-label="Request management" hidden></section>
      <!-- 7. Stationery management (StationeryItem_Request_Report) -->
      <section data-section="stationery" role="tabpanel" aria-label="Stationery management" hidden></section>
    </main>
  </div>

  <script src="https://static.zohocdn.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/creator-api.js"></script>
  <script src="js/loader.js"></script>
  <script src="js/model.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views.js"></script>
  <script src="js/views-modules.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
